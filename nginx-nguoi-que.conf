  # Đặt trong server { listen 443 ... } của zone-c.io.vn, TRƯỚC "location / {"

  # Game Dai Chien Nguoi Que: WebSocket online -> container nguoi-que-online
  location = /nguoi-que/ws {
    proxy_pass http://127.0.0.1:3070;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  # API tài khoản (đăng nhập Google, bảng xếp hạng) -> cùng container
  location ^~ /nguoi-que/api/ {
    proxy_pass http://127.0.0.1:3070;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 16k;
  }
  # Web tĩnh
  location = /nguoi-que {
    return 301 /nguoi-que/;
  }
  location ^~ /nguoi-que/ {
    alias /srv/nguoi-que/;
    index index.html;
    try_files $uri $uri/ /nguoi-que/index.html;
    location = /nguoi-que/sw.js {
      alias /srv/nguoi-que/sw.js;
      add_header Cache-Control "no-cache";
    }
    location ^~ /nguoi-que/assets/ {
      alias /srv/nguoi-que/assets/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
  }
