  # Đặt trong server { listen 443 ... } của zone-c.io.vn, TRƯỚC "location / {"

  # Game Stickman War: WebSocket online -> container stickman-war-online
  location = /stickman-war/ws {
    proxy_pass http://127.0.0.1:3070;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  # API tài khoản (đăng nhập Google, bảng xếp hạng) -> cùng container
  location ^~ /stickman-war/api/ {
    proxy_pass http://127.0.0.1:3070;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 16k;
  }
  # Trang admin (Rspack, apps/admin/dist): không cho máy tìm kiếm lập chỉ mục
  location = /stickman-war/admin {
    return 301 /stickman-war/admin/;
  }
  location ^~ /stickman-war/admin/ {
    alias /srv/stickman-war/admin/;
    index index.html;
    try_files $uri $uri/ /stickman-war/admin/index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
  }
  # Web tĩnh
  location = /stickman-war {
    return 301 /stickman-war/;
  }
  location ^~ /stickman-war/ {
    alias /srv/stickman-war/;
    index index.html;
    try_files $uri $uri/ /stickman-war/index.html;
    location = /stickman-war/sw.js {
      alias /srv/stickman-war/sw.js;
      add_header Cache-Control "no-cache";
    }
    location ^~ /stickman-war/assets/ {
      alias /srv/stickman-war/assets/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
  }
  # Đường dẫn cũ (bản trước khi đổi tên) -> đường dẫn mới, giữ cả ?room=MÃ
  location ^~ /nguoi-que {
    rewrite ^/nguoi-que(/.*)?$ /stickman-war$1 permanent;
  }
